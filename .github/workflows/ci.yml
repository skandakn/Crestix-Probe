name: Crestix Probe CI — QA, Build & Integration

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-qa:
    name: Frontend Install, Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Frontend installation
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Type checking
        run: npm run typecheck

      - name: Unit testing (Vitest & Feature Node Tests)
        run: |
          npm test
          npm run test:forecasting
          npm run test:terrain
          npm run test:sensors

      - name: Production build
        run: npm run build

  backend-qa:
    name: Backend Dependencies, Linting & Pytest Suite
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./test_crestix.db
      AUTH_ENABLED: "false"
      CORS_ORIGINS: http://localhost:3000
      SIMULATION_ADAPTER_MODE: stub
      FORECAST_ADAPTER_MODE: stub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend dependency installation
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic pydantic-settings sqlalchemy alembic httpx python-multipart pytest pytest-asyncio ruff
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

      - name: Backend linting (Ruff)
        run: |
          ruff check --select E4,E7,E9,F tests/backend
          if [ -d backend ]; then
            ruff check --select E4,E7,E9,F --ignore F401 backend
          fi

      - name: Backend tests (Pytest)
        run: |
          pytest tests/backend -v
          if [ -d backend/tests ]; then
            PYTHONPATH=backend pytest backend/tests -v
          fi

  e2e-playwright:
    name: End-to-End Journey Tests (Playwright)
    runs-on: ubuntu-latest
    needs: frontend-qa
    env:
      CI: "true"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E test suite
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
