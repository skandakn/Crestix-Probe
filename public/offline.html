<!DOCTYPE html>
<html lang="en" class="h-full bg-[#06080e] text-slate-100">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline Enclave | Crestix Probe</title>
  <meta name="theme-color" content="#06080e" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #06080e;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #0b0f17;
      border: 1px solid #1e293b;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }
    .icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .badge {
      display: inline-block;
      font-family: monospace;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      margin-bottom: 16px;
      letter-spacing: 1px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, #06b6d4, #0d9488);
      color: #06080e;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
      background: #151d2c;
      color: #cbd5e1;
      border: 1px solid #334155;
      margin-top: 10px;
    }
    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 20px;
      text-align: left;
    }
    .links-grid a {
      padding: 10px 12px;
      background: #0e1422;
      border: 1px solid #1e293b;
      border-radius: 8px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 12px;
      font-family: monospace;
    }
    .links-grid a:hover {
      background: #151d2c;
      border-color: #0284c7;
    }
    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    
    <div class="badge">
      <span class="pulse-dot"></span>OFFLINE TELEMETRY BUFFER
    </div>
    
    <h1>No Uplink Connectivity</h1>
    <p>
      The Crestix Probe station is currently disconnected from the remote network. 
      Cached telemetry and offline model predictions are stored locally on your mobile device.
    </p>

    <button class="btn" onclick="window.location.reload()">
      Attempt Downlink Reconnect
    </button>
    <a href="/dashboard" class="btn btn-secondary">
      Return to Local Dashboard
    </a>

    <div class="links-grid">
      <a href="/dashboard">📊 Dashboard</a>
      <a href="/forecasting">🌊 Forecasting</a>
      <a href="/simulation">⚙️ Simulation</a>
      <a href="/sensors">📡 Sensors</a>
    </div>
  </div>
</body>
</html>
