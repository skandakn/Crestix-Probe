<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#082f49" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#06080e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06080e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="probe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="#06080e"/>
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#082f49" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Orbital Sensor Rings -->
  <circle cx="256" cy="256" r="190" stroke="url(#ring-grad)" stroke-width="6" stroke-dasharray="14 10" opacity="0.75"/>
  <circle cx="256" cy="256" r="135" stroke="#06b6d4" stroke-width="5" stroke-dasharray="32 18" opacity="0.6"/>
  <circle cx="256" cy="256" r="85" stroke="#14b8a6" stroke-width="4" opacity="0.45"/>

  <!-- Hydrodynamic Flood Wave Contours -->
  <path d="M 120 310 C 180 270, 220 340, 256 310 C 292 280, 332 350, 392 310" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <path d="M 140 360 C 190 330, 225 385, 256 360 C 287 335, 322 390, 372 360" stroke="#14b8a6" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 170 410 C 210 390, 235 430, 256 410 C 277 390, 302 430, 342 410" stroke="#0e7490" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Central Probe Transmitter Tower / Needle -->
  <line x1="256" y1="110" x2="256" y2="300" stroke="url(#probe-grad)" stroke-width="10" stroke-linecap="round"/>
  <line x1="230" y1="210" x2="282" y2="210" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
  <line x1="240" y1="250" x2="272" y2="250" stroke="#14b8a6" stroke-width="6" stroke-linecap="round"/>

  <!-- Glowing Transmitter Beacon Pulse -->
  <circle cx="256" cy="110" r="24" fill="#0891b2" opacity="0.5" filter="url(#glow)"/>
  <circle cx="256" cy="110" r="14" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="256" cy="110" r="7" fill="#ffffff"/>

  <!-- Compass / Satellite Ticks -->
  <line x1="256" y1="40" x2="256" y2="58" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="454" x2="256" y2="472" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="40" y1="256" x2="58" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="454" y1="256" x2="472" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
</svg>
